<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="badge" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fb950" />
      <stop offset="1" stop-color="#1a7f37" />
    </linearGradient>
    <clipPath id="badge-clip">
      <rect x="14" y="14" width="92" height="92" rx="24" />
    </clipPath>
  </defs>

  <rect x="14" y="14" width="92" height="92" rx="24" fill="#2ea043" opacity="0.45" filter="url(#glow)" />
  <g clip-path="url(#badge-clip)">
    <rect x="14" y="14" width="92" height="92" fill="url(#badge)" />
    <!-- Orange leg-warmer stripe -->
    <rect x="14" y="96" width="92" height="10" fill="#ff8a1f" />
  </g>
  <rect x="14.75" y="14.75" width="90.5" height="90.5" rx="23.25" stroke="#aff5b4" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- "Nice guy" thumbs-up (Lucide thumbs-up, ISC license), 24px grid scaled to fit the badge -->
  <g transform="translate(33 30) scale(2.25)" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z" />
    <path d="M7 10v12" />
  </g>
</svg>
